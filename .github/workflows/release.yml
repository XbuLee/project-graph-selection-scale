name: Check and release extension

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Verify root metadata is committed and current
        run: |
          git ls-files --error-unmatch metadata.msgpack
          git diff --exit-code -- metadata.msgpack

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish extension and sharing archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GitHub 会移除附件文件名中的中文，中文名称放在显示标签中。
          share_archive="dist/selection-scale-${RELEASE_TAG}-share.zip"
          cp "dist/选区等比缩放-${RELEASE_TAG}-分享包.zip" "$share_archive"
          gh release create "$RELEASE_TAG" dist/local.selection-scale.prg "${share_archive}#选区等比缩放分享包" dist/*-source.zip --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
